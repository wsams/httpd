# Serve compiled CGI binaries from the document root (for example index.cgi).
# Build Go CGI apps with net/http/cgi (see examples/index.go).
<Directory /var/www/html>
  Options Indexes FollowSymLinks ExecCGI
  AllowOverride None
  Require all granted
  AddHandler cgi-script .cgi
  DirectoryIndex index.cgi index.html
</Directory>
